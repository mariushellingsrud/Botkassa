<script>
const SUPABASE_URL = 'https://zekqkxenfojvturunsge.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Deyp9MuenrsUOl7bSUEJDg_aaWdEuYv';
const KODE_KEY = 'botkassa-kode';
const ME_KEY = 'botkassa-meg';
const CACHE_KEY = 'botkassa-cache';
const LEGACY_KEY = 'botkassa-v1';
const IMPORT_DONE_KEY = 'botkassa-importert';
const INSTALL_HIDE_KEY = 'botkassa-skjul-installer';
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const JOKER_TASKS = ['Støvsugd og tørket støv i hele leiligheten', 'Vasket dusj og do grundig'];
const monthNames = ['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];
const plusIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const trashIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
const infoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>';
const jokerIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-1 2-7 6-7 11a5 5 0 005 5c-1 0-2 1-2 2h8c0-1-1-2-2-2a5 5 0 005-5c0-5-6-9-7-11z"/></svg>';
const chevron = '<svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
const shareIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></svg>';

let state = null;   // siste data fra databasen (bk_state)
let lastJson = '';
let view = 'home';
let setup = null;   // null | 'kode' | 'import' | 'meg'
let problem = null; // null | 'offline' | 'down'
let busy = false;

function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch(e) {} }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

// ---------- Database ----------

async function rpc(fn, args) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ kode: lsGet(KODE_KEY), ...args }),
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e) {}
  if (!res.ok) {
    const err = new Error((data && data.message) || 'Noe gikk galt (' + res.status + ')');
    err.status = res.status;
    throw err;
  }
  return data;
}

function toState(s) {
  const [y, m] = s.period.split('-').map(Number);
  return { ...s, currentMonth: { year: y, month: m - 1 } };
}

// Henter alt fra databasen. Returnerer true hvis noe på skjermen bør tegnes på nytt.
async function refresh() {
  if (!lsGet(KODE_KEY)) return false;
  try {
    const s = await rpc('bk_state');
    const json = JSON.stringify(s);
    const hadProblem = problem !== null;
    problem = null;
    if (json === lastJson) return hadProblem;
    lastJson = json;
    state = toState(s);
    lsSet(CACHE_KEY, json);
    return true;
  } catch (e) {
    const before = problem;
    handleError(e, true);
    return problem !== before;
  }
}

function handleError(e, silent) {
  if (e.message === 'Feil kode') {
    lsDel(KODE_KEY); lsDel(CACHE_KEY); syncUrl();
    state = null; lastJson = ''; setup = 'kode';
    closeModal(); render();
    toast('Koden er feil eller har blitt endret');
    return;
  }
  if (e instanceof TypeError) problem = 'offline';
  else if (!e.status || e.status >= 500) problem = 'down';
  if (!silent) toast(e instanceof TypeError ? 'Ingen nettforbindelse, prøv igjen' : e.message);
}

// Kjører en endring i databasen, henter ny data og tegner på nytt
async function act(fn, args, okMsg) {
  if (busy) return false;
  busy = true;
  try {
    await rpc(fn, args);
    await refresh();
    decideSetup();
    closeModal();
    render(true);
    if (okMsg) toast(okMsg, 'success');
    return true;
  } catch (e) {
    handleError(e);
    if (setup !== 'kode') render(true);
    return false;
  } finally {
    busy = false;
  }
}

let pollTimer = null;
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible') poll(); }, 5000);
}
async function poll() {
  if (busy || !lsGet(KODE_KEY)) return;
  const changed = await refresh();
  if (!changed) return;
  const a = document.activeElement;
  if (a && a.tagName === 'INPUT' && document.getElementById('content').contains(a)) { lastJson = ''; return; }
  decideSetup();
  render(true);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
window.addEventListener('online', poll);

// ---------- Oppstart: kode, gamle data, hvem er du ----------

function currentMe() {
  const id = Number(lsGet(ME_KEY));
  return (state && state.members.find(m => m.id === id)) || null;
}

function legacyData() {
  try {
    const d = JSON.parse(lsGet(LEGACY_KEY));
    if (!d || !Array.isArray(d.members) || d.members.length === 0) return null;
    // Engangs-halvering av reglene, rundet opp til nærmeste 5 kr (75 → 40)
    if (!d.pricesHalved && Array.isArray(d.rules)) d.rules = d.rules.map(r => ({ ...r, amount: Math.ceil(r.amount / 10) * 5 }));
    return d;
  } catch(e) { return null; }
}

function decideSetup() {
  if (!lsGet(KODE_KEY)) { setup = 'kode'; return; }
  if (!state) { setup = null; return; }
  if (state.members.length === 0 && legacyData() && !lsGet(IMPORT_DONE_KEY)) { setup = 'import'; return; }
  setup = currentMe() ? null : 'meg';
}

async function submitKode() {
  const k = (document.getElementById('s-kode')?.value || '').trim().toLowerCase();
  if (!k) { toast('Skriv inn koden'); return; }
  try {
    if (!(await rpc('bk_check', { kode: k }))) { toast('Feil kode'); return; }
    lsSet(KODE_KEY, k);
    // I Safari på iPhone: last siden på nytt med koden i adressen, så den følger med til Hjem-skjermen
    if (isIOS && !isStandalone) { location.replace(location.pathname + '?kode=' + encodeURIComponent(k)); return; }
    syncUrl();
    await refresh();
    decideSetup(); render(); startPolling();
  } catch (e) { handleError(e); render(); }
}

async function doImport() {
  const d = legacyData();
  if (!d) return;
  if (await act('bk_import', { p_data: d }, 'Dataene er lastet opp')) lsSet(IMPORT_DONE_KEY, '1');
}
function skipImport() { lsSet(IMPORT_DONE_KEY, '1'); decideSetup(); render(); }

function chooseMe(id) { haptic(); lsSet(ME_KEY, String(id)); decideSetup(); render(); }
async function addMe() {
  const name = (document.getElementById('s-name')?.value || '').trim();
  if (!name) { toast('Skriv inn navnet ditt'); return; }
  if (busy) return;
  busy = true;
  try {
    const id = await rpc('bk_add_member', { p_name: name });
    lsSet(ME_KEY, String(id));
    await refresh();
    decideSetup(); render();
    toast('Velkommen, ' + name, 'success');
  } catch (e) { handleError(e); } finally { busy = false; }
}
function switchMe() { haptic(); lsDel(ME_KEY); setup = 'meg'; render(); }

// Koden ligger i adressen, så den følger med når appen legges på Hjem-skjermen
// (på iPhone har Hjem-skjerm-appen egen lagring, atskilt fra Safari)
// (iOS tar ikke med #-delen, så koden ligger i ?kode=. Manifestet har ingen start_url,
// så iOS bruker adressen siden ble åpnet med.)
function syncUrl() {
  const k = lsGet(KODE_KEY);
  const want = k ? '?kode=' + encodeURIComponent(k) : '';
  if (location.search !== want || location.hash) history.replaceState(null, '', location.pathname + want);
}

function installCard() {
  if (!isIOS || isStandalone || lsGet(INSTALL_HIDE_KEY)) return '';
  return '<div class="install-card fade-in">' +
    '<div class="install-head"><img src="./apple-touch-icon.png" alt=""><div><div class="install-title">Legg Botkassa på Hjem-skjermen</div><div class="install-sub">Da åpnes den som en app, og koden følger med.</div></div></div>' +
    '<ol class="install-steps"><li>Trykk <strong>Del</strong> ' + shareIcon + ' (på nyere iPhoner ligger den i menyen ved adressefeltet)</li><li>Velg <strong>Legg til på Hjem-skjerm</strong> (under «Vis mer» hvis du ikke ser den)</li><li>Trykk <strong>Legg til</strong>, og åpne appen derfra</li></ol>' +
    '<button class="install-dismiss" onclick="hideInstall()">Ikke nå</button></div>';
}
function hideInstall() { lsSet(INSTALL_HIDE_KEY, '1'); render(true); }

// iOS-aktig bekreftelsesark i stedet for nettleserens confirm()
function confirmSheet(title, text, okLabel, danger) {
  return new Promise(resolve => {
    confirmSheet.resolve = resolve;
    document.getElementById('modal-root').innerHTML = '<div class="modal-bg" onclick="if(event.target===this)answerConfirm(false)"><div class="modal"><div class="modal-handle"></div><div class="modal-head"><div class="modal-title">' + esc(title) + '</div></div>' +
      '<div class="sheet-meta">' + esc(text) + '</div>' +
      '<div class="sheet-actions"><button class="' + (danger ? 'btn-danger' : 'btn-primary') + '" onclick="answerConfirm(true)">' + esc(okLabel) + '</button><button class="btn-secondary" style="color:#007AFF" onclick="answerConfirm(false)">Avbryt</button></div></div></div>';
  });
}
function answerConfirm(ok) {
  const resolve = confirmSheet.resolve;
  confirmSheet.resolve = null;
  closeModal();
  if (resolve) resolve(ok);
}

function shareLink() {
  const url = location.origin + location.pathname + '?kode=' + encodeURIComponent(lsGet(KODE_KEY) || '');
  if (navigator.share) navigator.share({ title: 'Botkassa', text: 'Bli med i Botkassa for kollektivet:', url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Lenke kopiert', 'success'), () => prompt('Kopier lenken:', url));
  else prompt('Kopier lenken:', url);
}

// ---------- Hjelpere ----------

function fmt(d) {
  const date = new Date(d);
  const diff = Math.floor((Date.now() - date.getTime()) / 3600000);
  if (diff < 1) return 'For ' + Math.max(1, Math.floor((Date.now() - date.getTime()) / 60000)) + ' min siden';
  if (diff < 24) return 'For ' + diff + 't siden';
  if (diff < 48) return 'I går';
  return date.toLocaleDateString('nb-NO', { day:'numeric', month:'short' });
}
function fmtDate(d) { return new Date(d).toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' }); }

const activeFines = () => state.fines.filter(f => !f.deletedAt);
const totalKasse = () => activeFines().filter(f => !f.usedJoker).reduce((s, f) => s + f.amount, 0);

// Jokere: 1 fast per måned + de som er tjent denne måneden − de som er brukt
function getMemberTotals() {
  const fines = activeFines();
  return state.members.map(m => {
    const mFines = fines.filter(f => f.memberId === m.id && !f.usedJoker);
    const used = fines.filter(f => f.memberId === m.id && f.usedJoker).length;
    const earned = state.earnings.filter(e => e.memberId === m.id).length;
    return {
      ...m,
      activeFines: mFines.length,
      jokerUsedCount: used,
      total: mFines.reduce((s, f) => s + f.amount, 0),
      jokers: Math.max(0, 1 + earned - used),
    };
  });
}

function toast(message, type) {
  const root = document.getElementById('toast-root');
  const icon = type === 'success' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16v.5"/></svg>';
  root.innerHTML = '<div class="toast ' + (type || '') + '">' + icon + '<span>' + esc(message) + '</span></div>';
  if (type === 'success') haptic();
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { root.innerHTML = ''; }, 2500);
}

function haptic() {
  if (navigator.vibrate) navigator.vibrate(10);
}

function hero(sub, title) {
  return '<div class="hero fade-in"><div class="hero-sub">' + sub + '</div><div class="hero-title">' + title + '</div></div>';
}
function avatar(m, size) {
  const s = size ? ' width:' + size + 'px; height:' + size + 'px; font-size:' + Math.round(size * 0.4) + 'px' : '';
  return '<div class="avatar" style="background:' + esc(m?.color || '#8e8e93') + ';' + s + '">' + esc((m?.name || '?').charAt(0).toUpperCase()) + '</div>';
}

    '<div class="fab-row fade-in"><button class="fab" onclick="openModal(\'addFine\')"><div class="fab-icon" style="background:#FF3B30">' + plusIcon + '</div><div class="fab-label">Ny bot</div><div class="fab-sub">Registrer brudd</div></button><button class="fab" onclick="openModal(\'earnJoker\')"><div class="fab-icon" style="background:#007AFF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="9" r="6"/><path d="M9 14l-2 7 5-3 5 3-2-7"/></svg></div><div class="fab-label">Logg husarbeid</div><div class="fab-sub">' + freeTasks + ' av 2 ledige denne uka</div></button></div>' +

    '<div class="action-card fade-in" onclick="openModal(\'closeMonth\')"><div class="action-icon" style="background:rgba(255,149,0,0.16); color:#FF9500"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21V5a1 1 0 011-1h12l-3 4 3 4H6"/></svg></div><div class="action-text"><div class="action-title">Avslutt måneden</div><div class="action-sub">Logg innbetalinger og start ny måned</div></div>' + chevron + '</div>';

function deletedRow(d) {

function renderArchive() {
  const deletedNow = state.fines.filter(f => f.deletedAt)
    .sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt))

  const n = arch.length;

        '</div>').join(''));

function render(keepScroll) {
  const el = document.getElementById('content');
  const top = el.scrollTop;
  document.querySelector('.tabbar').style.display = setup ? 'none' : '';
  let html;
  if (setup === 'kode') html = renderKode();
  else if (!state) html = hero('Botkassa', 'Henter…') + (problem ? '' : '<div class="empty">Henter data fra kollektivet…</div>');
  else if (setup === 'import') html = renderImport();
  else if (setup === 'meg') html = renderMeg();
  else if (view === 'home') html = renderHome();
  else if (view === 'rules') html = renderRules();
  else if (view === 'members') html = renderMembers();
  else html = renderArchive();
  el.innerHTML = problemBanner() + html;
  el.scrollTop = keepScroll ? top : 0;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === view));
}

// ---------- Handlinger ----------

function useJoker(fineId) {
  const f = state.fines.find(x => x.id === fineId);
  if (!f) return;
  const m = getMemberTotals().find(x => x.id === f.memberId);
  if (!m || m.jokers <= 0) { toast('Ingen jokere igjen'); return; }
  haptic();
  act('bk_use_joker', { p_fine: fineId }, 'Joker brukt');
}

function openFine(id) {
  const f = state.fines.find(x => x.id === id);
  if (!f || f.deletedAt) return;
  haptic();
  const m = getMemberTotals().find(x => x.id === f.memberId);
  const jokers = m ? m.jokers : 0;
  document.getElementById('modal-root').innerHTML = modalStart(esc(f.desc)) +
    '<div class="sheet-meta">' + esc(f.memberName) + ' · ' + f.amount + ' kr · ' + fmt(f.date) + (f.createdBy ? '<br>Registrert av ' + esc(f.createdBy) : '') + (f.usedJoker ? '<br>Joker er brukt på denne boten' : '') + '</div>' +
    '<div class="sheet-actions">' +
      (f.usedJoker ? '' : '<button class="btn-blue" onclick="useJoker(' + f.id + ')"' + (jokers <= 0 ? ' disabled' : '') + '>Bruk joker (' + esc(f.memberName) + ' har ' + jokers + ' igjen)</button>') +
      '<button class="btn-danger" onclick="deleteFine(' + f.id + ')">Slett bot (feilregistrert)</button>' +
    '</div>' +
    '<div class="sheet-note">Slettingen blir logget i Arkiv med navnet ditt.</div></div></div>';
}

async function deleteFine(id) {
  const f = state.fines.find(x => x.id === id);
  const me = currentMe();
  if (!f || !me) return;
  if (!(await confirmSheet('Slette boten?', '«' + f.desc + '» for ' + f.memberName + ' (' + f.amount + ' kr). Det blir logget i Arkiv at ' + me.name + ' slettet den.', 'Slett bot', true))) return;
  act('bk_delete_fine', { p_id: id, p_by: me.name }, 'Bot slettet');
}

async function deleteRule(id) {
  const r = state.rules.find(x => x.id === id);
  if (!r) return;
  haptic();
  if (!(await confirmSheet('Slette regelen?', '«' + r.desc + '» (' + r.amount + ' kr) fjernes fra lista. Bøter som allerede er gitt, påvirkes ikke.', 'Slett regel', true))) return;
  act('bk_remove_rule', { p_id: id }, 'Regel slettet');
}

async function deleteMember(id) {
  const m = state.members.find(x => x.id === id);
  if (!m) return;
  haptic();
  if (!(await confirmSheet('Fjerne ' + m.name + '?', 'Bøtene til ' + m.name + ' denne måneden blir slettet og logget i Arkiv.', 'Fjern beboer', true))) return;
  act('bk_remove_member', { p_id: id, p_by: currentMe()?.name || null }, 'Beboer fjernet');
}

function closeModal() {
  const root = document.getElementById('modal-root');
  const modal = root.querySelector('.modal');
  if (modal) {
    modal.style.animation = 'modalup 0.25s cubic-bezier(0.32, 0.72, 0, 1) reverse';
    setTimeout(() => { root.innerHTML = ''; }, 240);
  } else {
    root.innerHTML = '';
  }
}

function modalStart(title) {
  return '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-handle"></div><div class="modal-head"><div class="modal-title">' + title + '</div><button class="modal-close" onclick="closeModal()">Avbryt</button></div>';
}

function openModal(type) {
  haptic();
  const root = document.getElementById('modal-root');
  if (type === 'addFine') {
    if (state.members.length === 0) { toast('Legg til beboere først'); return; }
    if (state.rules.length === 0) { toast('Legg til regler først'); return; }
    root.innerHTML = modalStart('Registrer bot') +
      '<div class="field"><div class="field-label">HVEM?</div><select class="field-select" id="m-member"><option value="">Velg beboer...</option>' + state.members.map(m => '<option value="' + m.id + '">' + esc(m.name) + '</option>').join('') + '</select></div>' +
      '<div class="field"><div class="field-label">HVA?</div><select class="field-select" id="m-rule"><option value="">Velg regel...</option>' + state.rules.map(r => '<option value="' + r.id + '">' + esc(r.category) + ' — ' + esc(r.desc) + ' (' + r.amount + ' kr)</option>').join('') + '</select></div>' +
      '<div class="modal-btn-row"><button class="btn-primary" onclick="saveFine()">Lagre bot</button></div></div></div>';
  } else if (type === 'earnJoker') {
    if (state.members.length === 0) { toast('Legg til beboere først'); return; }
    const me = currentMe();
    const taken = state.weekTaken || {};
    const free = JOKER_TASKS.filter(t => !taken[t]);
    root.innerHTML = modalStart('Logg husarbeid') +
      '<div class="info-banner">' + infoIcon + '<span>Hver oppgave kan gjøres én gang per uke (mandag–søndag), uansett hvem som gjør den. De andre bør bekrefte at jobben er gjort.</span></div>' +
      (free.length === 0
        ? '<div class="setup-text">Begge oppgavene er tatt denne uka:<br>' + JOKER_TASKS.map(t => '• ' + esc(t) + ' (' + esc(taken[t]) + ')').join('<br>') + '<br><br>Ny uke starter mandag.</div><div class="modal-btn-row"><button class="btn-primary" onclick="closeModal()">OK</button></div>'
        : '<div class="field"><div class="field-label">HVEM?</div><select class="field-select" id="m-member">' + state.members.map(m => '<option value="' + m.id + '"' + (me && me.id === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') + '</select></div>' +
          '<div class="field"><div class="field-label">HVA BLE GJORT?</div><select class="field-select" id="m-task">' + JOKER_TASKS.map(t => '<option value="' + esc(t) + '"' + (taken[t] ? ' disabled' : '') + (t === free[0] ? ' selected' : '') + '>' + esc(t) + (taken[t] ? ' (tatt av ' + esc(taken[t]) + ')' : '') + '</option>').join('') + '</select></div>' +
          '<div class="modal-btn-row"><button class="btn-primary" onclick="saveJoker()">Registrer</button></div>') +
      '</div></div>';
  } else if (type === 'addMember') {
    root.innerHTML = modalStart('Ny beboer') +
      '<div class="field"><div class="field-label">NAVN</div><input class="field-input" id="m-name" placeholder="F.eks. Marius" autocapitalize="words" autocomplete="off" enterkeyhint="done"></div>' +
      '<div class="modal-btn-row"><button class="btn-primary" onclick="saveMember()">Legg til</button></div></div></div>';
    setTimeout(() => { const i = document.getElementById('m-name'); if (i) i.focus(); }, 100);
  } else if (type === 'addRule') {
    root.innerHTML = modalStart('Ny regel') +
      '<div class="field"><div class="field-label">KATEGORI</div><input class="field-input" id="m-cat" placeholder="F.eks. Kjøkken" autocapitalize="sentences" enterkeyhint="next"></div>' +
      '<div class="field"><div class="field-label">BESKRIVELSE</div><input class="field-input" id="m-desc" placeholder="Hva er bruddet?" autocapitalize="sentences" enterkeyhint="next"></div>' +
      '<div class="field"><div class="field-label">BELØP (KR)</div><input class="field-input" id="m-amt" type="number" inputmode="numeric" placeholder="40"></div>' +
      '<div class="modal-btn-row"><button class="btn-primary" onclick="saveRule()">Lagre regel</button></div></div></div>';
  } else if (type === 'closeMonth') {
    const totals = getMemberTotals();
    const total = totalKasse();
    paidIds = new Set();
    if (total === 0 && totals.every(m => m.total === 0)) {
      confirmSheet('Ingen bøter denne måneden', 'Vil du likevel avslutte ' + monthNames[state.currentMonth.month] + ' og gå videre til neste måned?', 'Avslutt måneden')
        .then(ok => { if (ok) act('bk_close_month', { p_period: state.period, p_paid: [] }, 'Måneden er arkivert'); });
      return;
    }
    root.innerHTML = modalStart('Avslutt ' + monthNames[state.currentMonth.month]) +
      '<div class="info-banner">' + infoIcon + '<span>Marker hvem som har betalt. Når alle er betalt, kan du arkivere måneden. Alle får 1 ny joker.</span></div>' +
      '<div class="pay-list">' + totals.map(m => '<div class="pay-row">' + avatar(m) + '<div class="item-main"><div class="item-title">' + esc(m.name) + '</div><div class="item-sub">' + m.activeFines + ' bøter</div></div><div class="item-amount" style="margin-right:10px">' + m.total + ' kr</div><div class="toggle ' + (m.total === 0 ? 'on checkbox-disabled' : '') + '" data-pay="' + m.id + '" onclick="togglePay(' + m.id + ')"></div></div>').join('') + '</div>' +
      '<div class="total-row"><div class="total-label">Totalt i kassa</div><div class="total-amount">' + total + ' kr</div></div>' +
      '<div class="modal-btn-row"><button class="btn-primary" id="confirm-close" onclick="confirmClose()">Godkjenn og arkiver</button></div></div></div>';
    setTimeout(() => updateCloseBtn(), 50);
  }
}

let paidIds = new Set();
function togglePay(id) {
  haptic();
  const tg = document.querySelector('[data-pay="' + id + '"]');
  if (paidIds.has(id)) { paidIds.delete(id); tg.classList.remove('on'); }
  else { paidIds.add(id); tg.classList.add('on'); }
  updateCloseBtn();
}
function updateCloseBtn() {
  const totals = getMemberTotals();
  const allPaid = totals.every(m => m.total === 0 || paidIds.has(m.id));
  const btn = document.getElementById('confirm-close');
  if (btn) btn.disabled = !allPaid;
}
function confirmClose() {
  const totals = getMemberTotals();
  if (!totals.every(m => m.total === 0 || paidIds.has(m.id))) return;
  const paid = [...paidIds];
  paidIds = new Set();
  act('bk_close_month', { p_period: state.period, p_paid: paid }, 'Måneden er arkivert');
}

function saveFine() {
  const memberId = Number(document.getElementById('m-member').value);
  const ruleId = Number(document.getElementById('m-rule').value);
  if (!memberId || !ruleId) { toast('Velg beboer og regel'); return; }
  act('bk_add_fine', { p_member: memberId, p_rule: ruleId, p_by: currentMe()?.name || null }, 'Bot registrert');
}
function saveJoker() {
  const memberId = Number(document.getElementById('m-member').value);
  const task = document.getElementById('m-task').value;
  if (!memberId) { toast('Velg beboer'); return; }
  act('bk_earn_joker', { p_member: memberId, p_task: task, p_by: currentMe()?.name || null }, 'Joker tjent');
}
function saveMember() {
  const name = document.getElementById('m-name').value.trim();
  if (!name) { toast('Skriv inn navn'); return; }
  act('bk_add_member', { p_name: name }, 'Beboer lagt til');
}
function saveRule() {
  const cat = document.getElementById('m-cat').value.trim();
  const desc = document.getElementById('m-desc').value.trim();
  const amt = parseInt(document.getElementById('m-amt').value);
  if (!cat || !desc || !amt) { toast('Fyll ut alle felt'); return; }
  act('bk_add_rule', { p_category: cat, p_desc: desc, p_amount: amt }, 'Regel lagt til');
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { if (setup) return; haptic(); view = t.dataset.tab; render(); }));

if ('serviceWorker' in navigator) {
  // Last siden på nytt når en ny versjon tar over, så alle kjører samme versjon
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) location.reload(); });
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

window.addEventListener('pageshow', e => { if (e.persisted) poll(); });

// Kode kan komme fra delt lenke eller Hjem-skjerm-ikonet: .../Botkassa/?kode=xxxx (eldre lenker: #kode=)
const urlKode = (location.search + location.hash).match(/kode=([^&#]+)/);
if (urlKode) {
  const k = decodeURIComponent(urlKode[1]).trim().toLowerCase();
  if (k !== lsGet(KODE_KEY)) { lsSet(KODE_KEY, k); lsDel(CACHE_KEY); }
}
syncUrl();
const cached = lsGet(CACHE_KEY);
if (cached && lsGet(KODE_KEY)) { try { state = toState(JSON.parse(cached)); lastJson = cached; } catch(e) {} }
decideSetup();
render();
if (lsGet(KODE_KEY)) { poll(); startPolling(); }
</script>
</body>
</html>
